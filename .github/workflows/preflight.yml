name: preflight

# Pre-merge build/test gate for the public go-kit module.
# Public repos get free GitHub-hosted Actions minutes — no self-hosted runner
# needed. Postgres is provisioned as a `services:` container so the
# telegram/fsm Postgres-backed guard tests — including the #155 regression
# (VARCHAR-too-narrow → 0 rows persisted) — run FOR REAL instead of
# t.Skip-ing (skip-to-green is forbidden: a DB test that t.Skips for a
# missing dep gets the dep provisioned, not skipped).
#
# golangci-lint runs via the official action with only-new-issues (ratchet:
# tolerates pre-existing backlog, fails the moment a PR introduces a NEW
# issue). fetch-depth: 0 lets --new-from-merge-base resolve origin/main.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: "off"
  # CGO_ENABLED=0: embed/onnx requires libtokenizers + libonnxruntime (C
  # libs not available on ubuntu-latest). The package has a !cgo stub that
  # returns ErrNoCGO — tests skip the cgo path. The race detector requires
  # CGO, so -race is not used on this runner (the Makefile's RACE var
  # auto-disables when CGO_ENABLED=0).
  CGO_ENABLED: "0"

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  # A doc is a doc only if no code reads it: a changed `.md`/`docs/` path that a non-doc
  # tracked file names (test, embed, build script) is reclassified as code, and the job log
  # says which file referenced it. Glob/dir reads the scan cannot see: --not-doc / --skip-job.
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" | curl -fsS --retry 2 -K - -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          # --- reference-aware pass: a doc that code reads is code ----------------------------
          scratch=
          cleanup() { if [ -n "$scratch" ] && [ -d "$scratch" ]; then rm -rf -- "$scratch"; fi; return 0; }
          trap cleanup EXIT
          # packaging manifests name README/CHANGELOG to ship it, not to read it
          pkg_manifest() {
            case "${1##*/}" in
              Cargo.toml | Cargo.lock | package.json | package-lock.json | pnpm-lock.yaml | pyproject.toml | setup.py | setup.cfg | MANIFEST.in | composer.json | *.gemspec | Dockerfile* | .goreleaser.y*ml | release-please-config.json) return 0 ;;
            esac
            return 1
          }
          community_file() {
            case "$1" in
              README | README.* | CHANGELOG | CHANGELOG.* | CHANGES | CHANGES.* | CONTRIBUTING | CONTRIBUTING.* | CODE_OF_CONDUCT | CODE_OF_CONDUCT.* | SECURITY | SECURITY.* | LICENSE | LICENSE.* | LICENCE | LICENCE.* | COPYING | NOTICE | AUTHORS) return 0 ;;
            esac
            return 1
          }
          ref_tree() { # shallow copy of the tree CI would test (the PR merge ref) in $scratch; non-zero on any doubt
            local rev tw=
            case "$EVENT" in
              pull_request) rev="refs/pull/$PR/merge" ;;
              *) rev="$AFTER" ;;
            esac
            command -v timeout >/dev/null 2>&1 && tw="timeout 120"
            scratch=$(mktemp -d) || { why="no scratch dir"; return 1; }
            git -C "$scratch" init -q || { why="git init failed"; return 1; }
            # the token travels in the environment, never argv (/proc/<pid>/cmdline is world-readable)
            GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
              $tw git -C "$scratch" fetch -q --depth=1 --no-tags "$SERVER/$REPO.git" "$rev" || { why="tree fetch failed ($rev)"; return 1; }
          }
          # ignore lists name files to leave out, never to read
          ignore_file() {
            case "${1##*/}" in .gitignore | .dockerignore | .npmignore | .prettierignore | .eslintignore | .gitattributes | .gitleaksignore | .markdownlintignore) return 0 ;; esac
            return 1
          }
          # third-party trees carry their own README/LICENSE/CHANGELOG mentions; they never read ours
          vendored() {
            case "$1" in
              vendor/* | */vendor/* | node_modules/* | */node_modules/* | third_party/* | */third_party/*) return 0 ;;
            esac
            return 1
          }
          # Does file $1 carry $2 on a line that is code? A comment line ("// see CLAUDE.md") names
          # a doc without reading it; directives that read ARE live (//go:embed, #[doc = include_str!]).
          # An occurrence inside a URL (https://host/blob/main/README.md) is a link, not a read.
          live_mention() {
            git -C "$scratch" cat-file blob "FETCH_HEAD:$1" 2>/dev/null | LC_ALL=C awk -v n="$2" '
              { s = $0; off = 0
                while ((i = index(s, n)) > 0) {
                  pre = substr($0, 1, off + i - 1); sub(/[A-Za-z0-9_@+.\/:~%-]*$/, "", pre)
                  tok = substr($0, length(pre) + 1, off + i - 1 - length(pre))
                  if (tok !~ /:\/\//) { l = $0; sub(/^[ \t]+/, "", l)
                    # a flag line (`--config docs/x.md`) is code; only `-- ` / `--` alone is an SQL comment
                    if (l ~ /^(\/\/go:|#\[|#!|#include|#embed|#import)/ || l !~ /^(\/\/|#|\* |\*\/|\*$|\/\*|-- |--$|<!--)/) { found = 1; exit } }
                  off += i + length(n) - 1; s = substr(s, i + length(n)) } }
              END { exit !found }'
          }
          # Does a non-doc tracked file read any of the candidate docs? 0 = no, 1 = yes (why says
          # which), 2 = the scan itself failed. Any non-zero means full CI.
          ref_scan() {
            local pats="$scratch/pats" f b hits line src m t bn dir stem p rc=0 start=$SECONDS
            declare -A seen
            : > "$pats"
            for f in "$@"; do
              b=${f##*/}
              # LICENSE, NOTICE, COPYING are English words and nothing reads them: not scanned
              case "$b" in *.*) printf '%s\n%s\n' "$f" "$b" >> "$pats" ;; esac
            done
            [ -s "$pats" ] || return 0
            # (1) literal: the full path or the basename as a whole word. The basename is what
            # filepath.Join(root, "docs", "x.md") and read('DESIGN.md') leave in the source.
            hits=$(git -C "$scratch" grep -I -w -F -o -f "$pats" FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="reference scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; m=${line#*:}
              [ -z "${seen[$src|$m]:-}" ] || continue
              seen[$src|$m]=1
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
              is_doc "$src" && continue
              vendored "$src" && continue
              ignore_file "$src" && continue
              pkg_manifest "$src" && community_file "${m##*/}" && continue
              live_mention "$src" "$m" || continue
              why="$m treated as code: referenced by $src"
              return 1
            done <<<"$hits"
            # (2) glob: embed/glob patterns with a literal stem (skills/d10-*.md) or a literal
            # directory (skills/*.md). Bare `*.md` / `**/*.md` come from ignore files, linters and
            # --include flags and would make every doc code: ignored, covered by --not-doc.
            rc=0
            hits=$(git -C "$scratch" grep -I -o -E -e '[A-Za-z0-9_@+./*?-]*[*?][A-Za-z0-9_@+./*?-]*[.]mdx?' FETCH_HEAD) || rc=$?
            [ "$rc" -le 1 ] || { why="glob scan failed (git grep rc $rc)"; return 2; }
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=${line#FETCH_HEAD:}; src=${line%%:*}; t=${line#*:}
              [ -z "${seen[$src|$t]:-}" ] || continue
              seen[$src|$t]=1
              is_doc "$src" && continue
              vendored "$src" && continue
              bn=${t##*/}; dir=
              case "$t" in */*) dir=${t%/*} ;; esac
              stem=${bn//[*?]/}; stem=${stem%.mdx}; stem=${stem%.md}
              if [ -z "$stem" ]; then
                case "$dir" in "" | *[*?]*) continue ;; esac
              fi
              for p in "$@"; do
                case "$p" in
                  $t | */$t)
                    live_mention "$src" "$t" || break
                    why="$t treated as code: glob in $src matches $p"
                    return 1 ;;
                esac
              done
              [ $((SECONDS - start)) -lt 90 ] || { why="reference scan exceeded 90s"; return 2; }
            done <<<"$hits"
            return 0
          }
          docs_only=false
          cands=()
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do
              if is_doc "$f"; then cands+=("$f"); else docs_only=false; why="code path: $f"; break; fi
            done <<<"$list"
            if [ "$docs_only" = true ]; then
              rc=0
              if ! ref_tree; then
                docs_only=false; why=${why:-tree fetch failed}
              else
                ref_scan "${cands[@]}" || rc=$?
                [ "$rc" -eq 0 ] || { docs_only=false; why=${why:-reference scan failed}; }
              fi
              [ "$docs_only" != true ] || why="${#cands[@]} doc paths, none read by code"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" | tee -a "$GITHUB_STEP_SUMMARY"

  preflight:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U test -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/testdb?sslmode=disable
      # pgutil migration tests read MIGRATE_TEST_DSN (or PGHOST/...) — point it
      # at the same service container so they RUN in CI instead of t.Skip.
      MIGRATE_TEST_DSN: postgres://test:test@localhost:5432/testdb?sslmode=disable

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # render/typst shells out to pandoc and typst; without them every test in
      # that package t.Skips, so the gate deciding the merge runs none of the
      # code under review. Same rule as the Postgres service above — provision
      # the dep, never skip to green. typst ships no apt package, so the
      # release binary is pinned to the version the fleet runs.
      #
      # fonts-ibm-plex is not optional decoration: every built-in theme sets
      # `font: "IBM Plex Sans"`, and typst SUBSTITUTES a missing family in
      # silence rather than failing. Without it the render tests pass while
      # exercising a fallback face — they assert on output the fleet never
      # produces.
      #
      # The `typst fonts` assertion below is the gate for that, not the golden
      # image tests: measured, substitution moves three of the four goldens by
      # under 1%, well inside their tolerance. Do not delete this step on the
      # assumption the goldens would catch its absence.
      # ffmpeg: voice/ tests encode real ogg/opus; without it the real-encode
      # test fails under CI (it must never skip there).
      - name: Install pandoc, typst, IBM Plex and ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc fonts-ibm-plex ffmpeg

          # Arch-derived so this step survives the move to ubuntu-24.04-arm that
          # the fleet CI rule specifies for public repos, instead of 404-ing.
          TYPST_VERSION=v0.14.2
          case "$(uname -m)" in
            x86_64)  TYPST_ARCH=x86_64;  TYPST_SHA=a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d ;;
            aarch64) TYPST_ARCH=aarch64; TYPST_SHA=491b101aa40a3a7ea82a3f8a6232cabb4e6a7e233810082e5ac812d43fdcd47a ;;
            *) echo "no pinned typst build for $(uname -m)"; exit 1 ;;
          esac
          TYPST_TARBALL="typst-${TYPST_ARCH}-unknown-linux-musl"

          # A git tag is mutable and a release asset is replaceable, so the
          # download is verified rather than trusted.
          curl -fsSL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/${TYPST_TARBALL}.tar.xz"
          echo "${TYPST_SHA}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/${TYPST_TARBALL}/typst" /usr/local/bin/typst

          pandoc --version | head -1
          typst --version
          # Written to a file rather than piped: grep -q exits early, and under
          # pipefail that surfaces typst's SIGPIPE as a spurious 141.
          typst fonts > /tmp/typst-fonts.txt
          grep -qx 'IBM Plex Sans' /tmp/typst-fonts.txt \
            || { echo "IBM Plex Sans not visible to typst — renders would silently fall back"; exit 1; }

      # #53: gostall — static analysis for lock-order inversions, missing
      # unlocks, WaitGroup misuse, channel deadlocks, livelocks, starvation.
      # gostall v1.0.0 pins x/tools v0.44.0, which cannot load Go 1.27 stdlib
      # types. scripts/install-gostall.sh builds the same v1.0.0 source against
      # a pinned current x/tools and rebuilds every run, so a stale binary on a
      # reused runner is never trusted. The gate itself is unchanged.
      - name: Build gostall v1.0.0 (pinned, current x/tools)
        run: scripts/install-gostall.sh

      - name: make preflight
        run: make preflight

      # golangci-lint disabled on GH-hosted: golangci-lint-action@v6 ships
      # v1.64.8 (built with go1.24), which can't load config for go1.27
      # (go-kit's toolchain). Re-enable once golangci-lint ships a go1.27-
      # compatible release. Lint runs on the self-hosted runner via
      # ~/.local/bin/golangci-lint for now.
      # - name: golangci-lint
      #   uses: golangci/golangci-lint-action@v6
      #   with:
      #     version: latest
      #     args: --timeout=10m --new-from-merge-base=origin/main ./...
      #     only-new-issues: true
